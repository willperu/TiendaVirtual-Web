<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Productos - Tienda Virtual</title>

    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/admin-productos.css" />
  </head>

  <body>
    <div class="container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>Tienda</h2>
        <ul>
          <li><a href="dashboard.html" class="active">Dashboard</a></li>
          <li><a href="admin-productos.html">Productos</a></li>
          <li><a href="ventas.html">Ventas</a></li>
          <li><a href="usuarios.html">Usuarios</a></li>
          <li><a href="tienda.html">🛍 Volver a la tienda</a></li>
          <li><a href="#" id="logoutBtn">Cerrar sesión</a></li>
        </ul>
      </div>

      <!-- CONTENIDO -->
      <div class="main">
        <h1>Productos</h1>

        <button onclick="mostrarFormulario()">➕ Nuevo producto</button>

        <br /><br />

        <table border="1" width="100%">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody id="tablaProductos"></tbody>
        </table>

        <br />

        <!-- FORMULARIO -->

        <!-- <div id="formularioProducto" style="display: none"> -->
          <div id="formularioProducto" class="modal-formulario">

            <div class="modal-contenido">

              <span class="cerrar-modal" onclick="cerrarFormulario()"> × </span>

              <h2>Producto</h2>          

              <input type="hidden" id="productoId" />

              <input type="text" id="nombre" placeholder="Nombre" />

              <input type="number" id="precio" placeholder="Precio" />

              <input type="number" id="stock" placeholder="Stock" />

              <label>Imagen del producto</label>

              <input type="file" id="imagenFile" accept="image/*" />s

                <select id="categoria">
                  <option value="">Seleccione categoría</option>

                  <option value="ELECTRONICOS">Electrónicos</option>

                  <option value="HOGAR">Hogar</option>

                  <option value="JUGUETES">Juguetes</option>

                  <option value="ROPA">Ropa</option>
                </select>

              <textarea id="descripcion"></textarea>

              <input type="text" id="colores" placeholder="Negro, Azul" />

              <input type="text" id="tallas" placeholder="S,M,L,XL" />

              <button onclick="guardarProducto()">Guardar</button>

            </div>   
          </div>         
        </div>
      </div>
    </div>

    <script type="module" src="js/admin-productos.js"></script>
  </body>
</html>
